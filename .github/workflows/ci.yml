name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      # The ESP32 core is about 1.5 GB; cache it per core version.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15/packages
            ~/.arduino15/staging
          key: arduino-esp32-3.3.12
      - run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.12
      - run: arduino-cli compile --fqbn esp32:esp32:esp32 firmware/ubx_bridge
